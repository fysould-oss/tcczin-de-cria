<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Hamasul</title>
    <link rel="stylesheet" href="../global/global.css">
    <link rel="stylesheet" href="../style/cadastro.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="container nav-wrap">
                <a href="inicio.html" class="logo" aria-label="Hamasul início">
                    <span class="brand-mark">H</span>
                    <span class="brand-text">HAMASUL</span>
                </a>
                <nav class="nav-links" aria-label="Navegação principal">
                    <a href="inicio.html">Início</a>
                    <a href="login.html">Login</a>
                </nav>
            </div>
        </header>

        <main class="cadastro-page">
            <section class="cadastro-card">
                <div class="cadastro-card__header">
                    <p class="eyebrow">Cadastro</p>
                    <h1>Crie sua conta</h1>
                    <p>Preencha os dados abaixo para começar</p>
                </div>

            <form class="cadastro-form">
                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha" required>
                </div>

                <button class="cadastro-button" type="submit">Cadastrar</button>
            </form>

            <p class="login-link">
                Já tem uma conta? <a href="login.html">Entrar</a>
            </p>
        </section>
        </main>
    </div>
</body>
</html>
