<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | CondoConnect</title><link rel="stylesheet" href="../assets/css/style.css"></head><body class="auth-page"><main class="auth-frame"><div class="container"><div class="auth-card"><p class="eyebrow">Cadastro</p><h1>Criar conta</h1><p>Cadastre-se para começar a usar a plataforma.</p><form data-register-form><label><span>Nome completo</span><input name="nome" required></label><label><span>CPF</span><input name="cpf"></label><label><span>E-mail</span><input type="email" name="email" required></label><label><span>Telefone</span><input name="telefone"></label><label><span>Senha</span><input type="password" name="senha" minlength="8" required></label><label><span>Confirme a senha</span><input type="password" name="confirmarSenha" minlength="8" required></label><label><span>Tipo de usuário</span><select name="tipoUsuario"><option value="morador">Morador</option><option value="prestador">Prestador</option><option value="sindico">Síndico</option></select></label><label><span>Condomínio</span><input name="condominio" required></label><button class="button button-primary" type="submit" style="width:100%">Criar conta</button></form><div class="auth-footer"><a href="login.html">Já possui conta? Entrar</a></div></div></div></main><script src="../assets/js/app.js"></script></body></html>
