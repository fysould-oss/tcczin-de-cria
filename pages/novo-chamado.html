<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo chamado | CondoConnect</title><link rel="stylesheet" href="../assets/css/style.css"></head><body class="auth-page"><main class="auth-frame"><div class="container"><div class="auth-card"><p class="eyebrow">Solicitação</p><h1>Nova solicitação de manutenção</h1><form data-ticket-form><label><span>Categoria</span><select name="categoria"><option>Elétrica</option><option>Hidráulica</option><option>Pintura</option><option>Limpeza</option><option>Elevadores</option><option>Jardinagem</option><option>Segurança</option><option>Reparos gerais</option></select></label><label><span>Título do problema</span><input name="titulo" required></label><label><span>Descrição</span><textarea name="descricao" rows="5" required></textarea></label><label><span>Local do problema</span><input name="localProblema" required></label><label><span>Prioridade</span><select name="prioridade"><option>Baixa</option><option>Média</option><option>Alta</option><option>Urgente</option></select></label><label><span>Data desejada</span><input type="date" name="dataServico" required></label><button class="button button-primary" type="submit" style="width:100%">Salvar chamado</button></form><div class="auth-footer"><a href="dashboard.html">Voltar ao painel</a></div></div></div></main><script src="../assets/js/app.js"></script></body></html>
