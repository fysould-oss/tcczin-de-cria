<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hamasul</title>
    <link rel="stylesheet" href="../global/global.css">
    <link rel="stylesheet" href="../style/login.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="container nav-wrap">
                <a href="inicio.html" class="logo" aria-label="Hamasul início">
                    <span class="brand-mark">H</span>
                    <span class="brand-text">HAMASUL</span>
                </a>
                <nav class="nav-links" aria-label="Navegação principal">
                    <a href="inicio.html">Início</a>
                    <a href="cadastro.html">Cadastro</a>
                </nav>
            </div>
        </header>

        <main class="login-page">
            <section class="login-card">
                <div class="login-card__header">
                    <p class="eyebrow">Acesso</p>
                    <h1>Entrar na conta</h1>
                    <p>Bem-vindo de volta! Faça login para continuar</p>
                </div>

            <form class="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <button class="login-button" type="submit">Entrar</button>
            </form>

            <p class="cadastro-link">
                Não possui uma conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
        </section>
        </main>
    </div>
</body>
</html>
